<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Six Degrees of Hollywood</title>
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <style>
    body { margin: 0; padding: 16px 24px; font-family: system-ui, "Segoe UI", sans-serif; background: #f6f5f2; color: #1d1d1f; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    #summary { color: #555; margin-bottom: 10px; }
    #controls { float: right; font-size: 14px; }
    #chain span { display: inline-block; padding: 3px 10px; margin: 2px; border-radius: 12px; font-size: 14px; }
    .actor { background: #dbe5f8; }
    .movie { background: #f7e3c9; }
    #stats { font-size: 13px; color: #555; margin: 8px 0; }
    #network { height: 70vh; background: white; border: 1px solid #ddd; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="controls">
    <label><input type="checkbox" id="showNearby" checked> Show nearby nodes</label>
    <input type="file" id="fileInput" accept=".json">
  </div>
  <h1>Six Degrees of Hollywood</h1>
  <div id="summary">Loading path.json...</div>
  <div id="chain"></div>
  <div id="stats"></div>
  <div id="network"></div>

  <script>
    // Shows a path exported with: six_degrees ... --export viz/path.json
    let data = null;

    function showSummary() {
      let text = data.sourceName + " to " + data.targetName + ": ";
      if (data.degrees < 0) {
        text += "not connected";
      } else {
        text += data.degrees + " degrees of separation";
      }
      document.getElementById("summary").textContent = text + " (" + data.algorithm + ")";

      // The path nodes come first in the file, in order.
      const chain = document.getElementById("chain");
      chain.innerHTML = "";
      if (data.degrees >= 0) {
        for (let i = 0; i < data.nodes.length; i++) {
          const node = data.nodes[i];
          if (!node.onPath) {
            continue;
          }
          if (chain.children.length > 0) {
            chain.append(" → ");
          }
          const chip = document.createElement("span");
          chip.className = node.type;
          chip.textContent = node.label;
          chain.appendChild(chip);
        }
      }

      document.getElementById("stats").textContent = "Actors visited: " + data.actorsVisited + " | Movies visited: " + data.moviesVisited + " | Time: " + data.ms.toFixed(3) + " ms";
    }

    function drawGraph() {
      const showNearby = document.getElementById("showNearby").checked;
      const nodes = [];
      const shown = {};
      let pathIndex = 0;

      for (let i = 0; i < data.nodes.length; i++) {
        const node = data.nodes[i];
        if (!node.onPath && !showNearby) {
          continue;
        }
        const isMovie = node.type === "movie";
        const visNode = { id: node.id, label: node.label, shape: isMovie ? "box" : "ellipse", margin: 8 };

        if (node.onPath) {
          // Path nodes are fixed in a row from left to right.
          visNode.x = pathIndex * 180;
          visNode.y = 0;
          visNode.fixed = true;
          visNode.color = isMovie ? "#d9862b" : "#3b6fd8";
          visNode.font = { color: "white" };
          pathIndex++;
        } else {
          visNode.color = isMovie ? "#f3ece2" : "#e9edf3";
          visNode.font = { color: "#666" };
        }
        nodes.push(visNode);
        shown[node.id] = true;
      }

      const edges = [];
      for (let i = 0; i < data.edges.length; i++) {
        const edge = data.edges[i];
        if (shown[edge.from] && shown[edge.to]) {
          edges.push({ from: edge.from, to: edge.to, width: edge.onPath ? 3 : 1, color: edge.onPath ? "#333" : "#ccc" });
        }
      }

      const container = document.getElementById("network");
      new vis.Network(container, { nodes: nodes, edges: edges }, {});
    }

    function load(text) {
      data = JSON.parse(text);
      showSummary();
      drawGraph();
    }

    document.getElementById("showNearby").addEventListener("change", function () {
      if (data) {
        drawGraph();
      }
    });

    // Lets you pick a JSON file, which also works when the page is opened straight from disk.
    document.getElementById("fileInput").addEventListener("change", function (event) {
      const reader = new FileReader();
      reader.onload = function () {
        load(reader.result);
      };
      reader.readAsText(event.target.files[0]);
    });

    function getText(response) {
      return response.text();
    }

    function showLoadError() {
      document.getElementById("summary").textContent = "Could not load path.json. Run a local server or choose the file above.";
    }

    // Loading path.json automatically only works through a local server.
    fetch("path.json").then(getText).then(load).catch(showLoadError);
  </script>
</body>
</html>
